name: Proposer une fonctionnalité
description: Une idée pour améliorer ZackPDF
labels: [amélioration]
body:
  - type: textarea
    id: problem
    attributes:
      label: Quel besoin ou quel problème ?
      description: Explique la situation dans laquelle cette fonctionnalité t'aiderait.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution envisagée
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
