name: Release

# Pousser un tag (ex. `git tag v1.0.1 && git push origin v1.0.1`) construit
# l'application pour Windows, macOS et Linux et publie une release GitHub.
# Le site télécharge toujours les fichiers de la dernière release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Outils de paquets Linux
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - run: npm ci
      - run: npm run build

      - name: Construire les paquets
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # Pas de certificat de signature : on ne cherche pas d'identité dans le trousseau macOS
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: paquets-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquets
          merge-multiple: true

      - name: Sommes de contrôle
        working-directory: paquets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" paquets/*
          --repo "$GITHUB_REPOSITORY"
          --title "Lecteur PDF $GITHUB_REF_NAME"
          --generate-notes
