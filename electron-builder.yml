appId: io.github.codebydarknet.zackpdf
productName: ZackPDF
copyright: Copyright © 2026 Abdoul Razack Ouedraogo
directories:
  buildResources: build
  output: release
files:
  - dist
  - dist-electron
fileAssociations:
  - ext: pdf
    name: Document PDF
    mimeType: application/pdf
    role: Viewer
# Noms de fichiers sans numéro de version : le site pointe vers
# https://github.com/codeByDarknet/zackpdf/releases/latest/download/<nom>
publish: null

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ZackPDF-Windows-Setup.${ext}
portable:
  artifactName: ZackPDF-Windows-Portable.${ext}

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: ZackPDF-macOS-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  executableName: zackpdf
  category: Office
  synopsis: Le lecteur PDF avec onglets et panneaux multiples
  mimeTypes:
    - application/pdf
  icon: build/icon.png
  artifactName: ZackPDF-Linux-${arch}.${ext}
deb:
  artifactName: zackpdf_${arch}.${ext}
rpm:
  artifactName: zackpdf.${arch}.${ext}
